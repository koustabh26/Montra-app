name: Bug report
description: Something in Montra does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include your PIN, backup files, or personal financial data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Settings → About shows the version.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 14, Pixel 7"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs (optional)
      description: Remove any personal data first.
