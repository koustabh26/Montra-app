name: Build signed release APK

# Manual only. This workflow does NOT create a GitHub Release, tag, or publish
# anywhere; it only uploads the APK as a workflow artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/montra-release.jks
            {
              echo "MONTRA_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MONTRA_KEY_PASSWORD=$KEY_PASSWORD"
              echo "MONTRA_KEY_ALIAS=${KEY_ALIAS:-montra}"
            } >> "$GITHUB_ENV"
            echo "Using the repository signing key."
          else
            EPHEMERAL_PW="$(openssl rand -hex 16)"
            echo "::add-mask::$EPHEMERAL_PW"
            keytool -genkeypair -keystore keystore/montra-release.jks -alias montra \
              -keyalg RSA -keysize 2048 -validity 30 \
              -storepass "$EPHEMERAL_PW" -keypass "$EPHEMERAL_PW" \
              -dname "CN=Montra CI temporary key"
            {
              echo "MONTRA_STORE_PASSWORD=$EPHEMERAL_PW"
              echo "MONTRA_KEY_PASSWORD=$EPHEMERAL_PW"
              echo "MONTRA_KEY_ALIAS=montra"
            } >> "$GITHUB_ENV"
            echo "::warning::No signing secrets configured. Using a temporary key; this APK is for testing only."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -v "SHA-" || true
          "$APKSIGNER" verify app/build/outputs/apk/release/*.apk

      - name: Remove key material
        if: always()
        run: rm -rf keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Montra-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
